name: build
on: [pull_request, push, workflow_dispatch]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Minecraft 26.1.x and 26.2 share one source tree; -PmcLine picks the dependency set.
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mcLine: ['26.1', '26.2']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: build ${{ matrix.mcLine }}
        run: ./gradlew build -PmcLine=${{ matrix.mcLine }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.mcLine }}
          path: |
            fabric/build/libs/
            neoforge/build/libs/
          retention-days: 7

  # The 1.21 line is frozen as a self-contained Gradle build under legacy/.
  build-legacy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: legacy
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: build 1.21
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-1.21
          path: |
            legacy/fabric/build/libs/
            legacy/neoforge/build/libs/
          retention-days: 7
