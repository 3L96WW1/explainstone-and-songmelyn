pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
				includeGroup('fabric-loom')
			}
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'NeoForge'
					url = uri('https://neoforged.forgecdn.net/releases')
				}
			}
			filter {
				includeGroupAndSubgroups('net.neoforged')
			}
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'explainstone'
include('common')
include('fabric')
include('neoforge')

// Minecraft version lines. Everything that differs between them lives here so a
// single branch builds both with -PmcLine=26.1 / -PmcLine=26.2.
def mcLines = [
		'26.1': [
				version                      : '1.1.0-beta+26.1',
				minecraft_version            : '26.1.2',
				minecraft_version_range      : '[26.1,26.2)',
				fabric_minecraft_version_range: '>=26.1 <26.2',
				neo_form_version             : '26.1.2-1',
				fabric_version               : '0.155.3+26.1.2',
				neoforge_version             : '26.1.2.125',
				neoforge_loader_version_range: '[4,)',
		],
		'26.2': [
				version                      : '1.1.0-beta+26.2',
				minecraft_version            : '26.2',
				minecraft_version_range      : '[26.2,26.3)',
				fabric_minecraft_version_range: '>=26.2 <26.3',
				neo_form_version             : '26.2-2',
				fabric_version               : '0.161.0+26.2',
				neoforge_version             : '26.2.0.93',
				neoforge_loader_version_range: '[4,)',
		],
]

def requested = gradle.startParameter.projectProperties.get('mcLine') ?: '26.2'
def line = mcLines[requested]
if (line == null) {
	throw new GradleException("Unknown mcLine '${requested}'. Valid: ${mcLines.keySet().join(', ')}")
}

gradle.beforeProject { project ->
	line.each { key, value ->
		if (key == 'version') {
			project.version = value
		} else {
			project.ext.set(key, value)
		}
	}
}
