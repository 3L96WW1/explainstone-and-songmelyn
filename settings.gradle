pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
				includeGroup('fabric-loom')
			}
		}
		maven {
			name = 'MinecraftForge'
			url = uri('https://maven.minecraftforge.net/')
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'explainstone'
include('common')
include('fabric')
include('forge')
