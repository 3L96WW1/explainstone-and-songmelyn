plugins {
	id 'fabric-loom' version '1.8-SNAPSHOT'
	id 'maven-publish'
}

version = '1.0.0-beta+1.21.1'
group = 'com.ginka.explainstone'

base {
	archivesName = 'explainstone-and-songmelyn'
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"explainstone" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:1.21.1"
	mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
	modImplementation "net.fabricmc:fabric-loader:0.20.1"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
	//clientCompileOnly minecraftClientOnlyNamedCompile
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}